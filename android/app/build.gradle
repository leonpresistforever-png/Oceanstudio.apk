apply plugin: 'com.android.application'
apply plugin: 'com.google.gms.google-services'

def resolveOceanFirebaseApiKey() {
    def fromEnv = System.getenv('OCEAN_FIREBASE_API_KEY')
    if (fromEnv != null && !fromEnv.trim().isEmpty()) return fromEnv.trim()
    def services = file('google-services.json')
    if (!services.exists()) return ''
    def parsed = new groovy.json.JsonSlurper().parse(services)
    def clients = parsed.client instanceof List ? parsed.client : [parsed.client]
    for (def client : clients) {
        def packageName = client?.client_info?.android_client_info?.package_name
        if (packageName != 'studio.ocean.app') continue
        def keys = client?.api_key
        if (keys instanceof List && !keys.isEmpty()) {
            def key = keys[0]?.current_key
            if (key != null && !key.toString().isEmpty()) return key.toString()
        }
    }
    return ''
}

def resolveOceanBuildCommit() {
    def fromEnv = System.getenv('OCEAN_BUILD_COMMIT')
    if (fromEnv != null && !fromEnv.trim().isEmpty()) return fromEnv.trim()
    try {
        def stdout = new ByteArrayOutputStream()
        exec {
            commandLine 'git', 'rev-parse', 'HEAD'
            standardOutput = stdout
        }
        def res = stdout.toString().trim()
        if (!res.isEmpty()) return res
    } catch (Exception ignored) {}
    return 'local'
}

// AppCompat/Core transitively request different Kotlin stdlib generations.
// Keep every compatibility artifact on one generation to prevent duplicate classes.
configurations.configureEach {
    resolutionStrategy.force(
            'org.jetbrains.kotlin:kotlin-stdlib:1.8.22',
            'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22',
            'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22')
}

android {
    namespace "studio.ocean.app"
    compileSdk rootProject.ext.compileSdkVersion
    buildToolsVersion "35.0.0"
    if (System.getenv('OCEAN_FORGE_REUSE_NATIVE') == 'true') buildToolsVersion "34.0.4"
    ndkVersion "27.0.12077973"
    defaultConfig {
        applicationId "studio.ocean.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 22
        versionName "1.3.2"
        if (project.hasProperty('oceanForgeVersionCode')) versionCode Integer.parseInt(project.property('oceanForgeVersionCode').toString())
        if (project.hasProperty('oceanForgeVersionName')) versionName project.property('oceanForgeVersionName').toString()
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild { cmake { arguments '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON' } }
        buildConfigField "String", "OCEAN_FIREBASE_API_KEY", "\"${resolveOceanFirebaseApiKey()}\""
        buildConfigField "String", "OCEAN_BUILD_COMMIT", "\"${resolveOceanBuildCommit()}\""
        buildConfigField "String", "OCEAN_BOOTSTRAP_BUILD_COMMIT", "\"${System.getenv('OCEAN_BOOTSTRAP_BUILD_COMMIT') ?: 'local'}\""
        buildConfigField "String", "OCEAN_BOOTSTRAP_VERSION", "\"${System.getenv('OCEAN_BOOTSTRAP_VERSION') ?: 'not-bundled'}\""
        buildConfigField "String", "OCEAN_BOOTSTRAP_SHA256", "\"${System.getenv('OCEAN_BOOTSTRAP_SHA256') ?: 'not-bundled'}\""
    }
    buildFeatures { buildConfig true }
    // Ocean Forge can rebuild Java/resources on-device by reusing the installed,
    // already-verified PTY library when native source is unchanged.
    def forgeReuseNative = System.getenv('OCEAN_FORGE_REUSE_NATIVE') == 'true'
    if (!forgeReuseNative) {
        externalNativeBuild { cmake { path file('src/main/cpp/CMakeLists.txt') } }
    }
    sourceSets {
        main {
            if (forgeReuseNative) jniLibs.srcDir 'src/forgeNative'
        }
    }
    // Android AssetManager.open() cannot stream-decompress assets > 1 MB that are DEFLATED.
    // The 17+ MB ocean bootstrap archive MUST be stored uncompressed, or installation silently fails.
    // All native .so libraries must also be stored uncompressed for system linker mmap.
    aaptOptions {
        noCompress 'zst', 'tar', 'zstd', 'so', 'gz', 'br', 'bz2', 'lz4', 'xz', 'zip'
    }
    packagingOptions {
        // Keep .so files uncompressed in the APK so the system linker can mmap them directly.
        // This is required for both extractNativeLibs=false and for reliable JNI loading.
        jniLibs.useLegacyPackaging = false
    }
    def forgeKeystorePath = System.getenv('OCEAN_FORGE_KEYSTORE')
    signingConfigs {
        if (forgeKeystorePath) {
            forge {
                storeFile file(forgeKeystorePath)
                storePassword System.getenv('OCEAN_FORGE_STORE_PASS') ?: ''
                keyAlias System.getenv('OCEAN_FORGE_KEY_ALIAS') ?: ''
                keyPassword System.getenv('OCEAN_FORGE_KEY_PASS') ?: ''
            }
        }
    }
    buildTypes {
        debug {
            if (forgeKeystorePath) signingConfig signingConfigs.forge
            // Debug APKs always expose the visibly labelled testing-only entry.
            buildConfigField "boolean", "OCEAN_DEV_AUTH_BYPASS", "true"
        }
        release {
            // Hard-disabled regardless of environment: release builds never contain the bypass.
            buildConfigField "boolean", "OCEAN_DEV_AUTH_BYPASS", "false"
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation platform('com.google.firebase:firebase-bom:33.7.0')
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.android.gms:play-services-auth:21.2.0'
    implementation project(':terminal-emulator')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.browser:browser:1.8.0"
    implementation "androidx.webkit:webkit:1.12.1"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation 'androidx.browser:browser:1.8.0'
    implementation "org.apache.commons:commons-compress:1.27.1"
    // The default Maven artifact is a desktop JAR whose native payload lives
    // under /linux/aarch64 and is not packaged as an Android JNI library.
    // Select the Android AAR so Gradle installs the bionic arm64 library under
    // lib/arm64-v8a/ and System.loadLibrary can resolve it on first bootstrap.
    implementation "com.github.luben:zstd-jni:1.5.6-9@aar"
    testImplementation "junit:junit:$junitVersion"
    testImplementation "org.json:json:20240303"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
}


/*
 * Ocean Forge self-source bundle.
 * Every APK carries the source subset required for the next on-device rebuild.
 * Build outputs/caches and signing material are never included.
 */
def forgeGeneratedAssets = file("$buildDir/generated/forgeAssets")
def forgeToolSourceDir = rootProject.projectDir.parentFile.toPath()
        .resolve("ocean-packages/packages/ocean-tools/data/data/studio.ocean.app/files/usr/bin").toFile()
def prepareForgeRuntimeCommand = tasks.register("prepareForgeRuntimeCommand", Copy) {
    from(new File(forgeToolSourceDir, "ocean-forge"))
    into(file("$buildDir/generated/forgeAssets/ocean/forge"))
}
def prepareForgeToolOverlay = tasks.register("prepareForgeToolOverlay", Copy) {
    from(forgeToolSourceDir)
    into(file("$buildDir/generated/forgeAssets/ocean/forge/tools"))
}
def prepareForgeSourceBundle = tasks.register("prepareForgeSourceBundle", Zip) {
    archiveFileName = "source.zip"
    destinationDirectory = file("$buildDir/generated/forgeAssets/ocean/forge")
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    from(rootProject.projectDir) {
        into "android"
        exclude ".gradle/**"
        exclude "**/.cxx/**"
        exclude "**/.externalNativeBuild/**"
        exclude "**/build/**"
        exclude "**/.idea/**"
        exclude "**/*.jks"
        exclude "**/*.keystore"
        exclude "**/*.p12"
        exclude "**/local.properties"
    }
    from(rootProject.projectDir.parentFile) {
        include "scripts/verify-native-only.sh"
        include "packages/ocean-prefix.env"
        include "PACKAGE_SOURCE_POLICY.md"
        include "ocean-packages/CANONICAL_PACKAGE_SOURCE.json"
        include "ocean-packages/DO_NOT_EDIT_PACKAGE_SNAPSHOT.md"
        include "ocean-packages/packages/ocean-tools/**"
        include "ocean-packages/scripts/**"
    }
}

android.sourceSets.main.assets.srcDir(forgeGeneratedAssets)
tasks.named("preBuild").configure {
    dependsOn(prepareForgeRuntimeCommand)
    dependsOn(prepareForgeToolOverlay)
    dependsOn(prepareForgeSourceBundle)
}

tasks.register("verifyBundledScriptShebangs") {
    doLast {
        def prefix = "/data/data/studio.ocean.app/files/usr"
        def packageRoot = rootProject.projectDir.parentFile.toPath().resolve("ocean-packages/packages")
        def roots = [
                packageRoot.resolve("ocean-tools/data/data/studio.ocean.app/files/usr/bin").toFile(),
                packageRoot.resolve("ocean-pkg").toFile(),
                packageRoot.resolve("ocean-hello").toFile(),
                packageRoot.resolve("ocean-distro/ocean-distro").toFile(),
                packageRoot.resolve("proot-distro/proot-distro").toFile(),
                file("src/main/assets/ocean/pkg")
        ]
        def offenders = []
        roots.each { root ->
            if (!root.exists()) return
            def files = root.isFile() ? [root] : []
            if (root.isDirectory()) root.eachFileRecurse { candidate -> if (candidate.isFile()) files << candidate }
            files.each { file ->
                if (file.length() > 4 * 1024 * 1024) return
                def head = file.withInputStream { stream ->
                    byte[] buffer = new byte[256]
                    int count = stream.read(buffer)
                    count > 0 ? new String(buffer, 0, count, java.nio.charset.StandardCharsets.UTF_8) : ""
                }
                if (!head.startsWith("#!")) return
                def line = head.split("\\R", 2)[0]
                if (line.contains("/usr/bin/env")) offenders << "${file}: ${line}"
                else if ((line.contains("/bin/bash") || line.contains("/bin/sh")) && !line.startsWith("#!${prefix}/")) {
                    offenders << "${file}: ${line}"
                }
            }
        }
        if (!offenders.isEmpty()) {
            throw new GradleException("Bundled scripts must not use /usr/bin/env or host /bin/* shebangs:\n" + offenders.join("\n"))
        }
    }
}

afterEvaluate {
    tasks.findByName("testDebugUnitTest")?.dependsOn("verifyBundledScriptShebangs")
    tasks.findByName("assembleDebug")?.dependsOn("verifyBundledScriptShebangs")
}
