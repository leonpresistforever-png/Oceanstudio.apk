apply plugin: 'com.android.application'

// AppCompat/Core transitively request different Kotlin stdlib generations.
// Keep every compatibility artifact on one generation to prevent duplicate classes.
configurations.configureEach {
    resolutionStrategy.force(
            'org.jetbrains.kotlin:kotlin-stdlib:1.8.22',
            'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22',
            'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22')
}

android {
    namespace "studio.ocean.app"
    compileSdk rootProject.ext.compileSdkVersion
    ndkVersion "27.0.12077973"
    defaultConfig {
        applicationId "studio.ocean.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        buildConfigField "String", "OCEAN_FIREBASE_API_KEY", "\"${System.getenv('OCEAN_FIREBASE_API_KEY') ?: ''}\""
    }
    buildFeatures { buildConfig true }
    externalNativeBuild { cmake { path file('src/main/cpp/CMakeLists.txt') } }
    buildTypes {
        debug {
            buildConfigField "boolean", "OCEAN_DEV_AUTH_BYPASS", "${(System.getenv('OCEAN_DEV_AUTH_BYPASS') ?: 'false').toBoolean()}"
        }
        release {
            // Hard-disabled regardless of environment: release builds never contain the bypass.
            buildConfigField "boolean", "OCEAN_DEV_AUTH_BYPASS", "false"
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "org.apache.commons:commons-compress:1.27.1"
    implementation "com.github.luben:zstd-jni:1.5.6-9"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
}
