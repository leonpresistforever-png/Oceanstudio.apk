name: Promote staged Ocean packages
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/promote-staged-packages.trigger'
permissions:
  contents: read
concurrency:
  group: ocean-package-promotion
  cancel-in-progress: false
jobs:
  promote:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Checkout complete public pool and staging
        uses: actions/checkout@v5
        with:
          repository: leonpresistforever-png/Oceanstudio-packages
          ref: main
          path: public-packages
          token: ${{ secrets.OCEAN_PACKAGES_PUBLISH_TOKEN }}
          fetch-depth: 1
      - name: Validate publisher behavior
        run: python3 public-packages/tests/test-index-publication.py
      - name: Record complete coverage before mutation
        working-directory: public-packages
        continue-on-error: true
        run: python3 scripts/audit_repository.py --json /tmp/ocean-apt-before.json
      - name: Inventory every pool and staged candidate
        working-directory: public-packages
        run: python3 scripts/index_all_staged.py --plan /tmp/ocean-apt-selection.json
      - name: Import existing archive key into an isolated signing home
        env:
          OCEAN_REPOSITORY_SIGNING_KEY: ${{ secrets.OCEAN_REPOSITORY_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$OCEAN_REPOSITORY_SIGNING_KEY" ]; then
            echo '::error::Existing OCEAN_REPOSITORY_SIGNING_KEY is unavailable; live publication is blocked.'
            exit 1
          fi
          signing_home=$(mktemp -d)
          chmod 700 "$signing_home"
          echo "GNUPGHOME=$signing_home" >> "$GITHUB_ENV"
          printf '%s\n' "$OCEAN_REPOSITORY_SIGNING_KEY" | GNUPGHOME="$signing_home" gpg --batch --import
          expected=$(tr -d '[:space:]' < ocean-packages/keys/ocean-development-repository.fingerprint)
          actual=$(gpg --batch --show-keys --with-colons public-packages/apt/ocean.gpg 2>/dev/null | awk -F: '$1=="fpr"{print $10;exit}')
          test "$actual" = "$expected"
      - name: Publish through the complete canonical indexer
        working-directory: public-packages
        run: |
          set -euo pipefail
          python3 scripts/index_all_staged.py
          python3 scripts/audit_repository.py --json /tmp/ocean-apt-after.json
          git config user.name 'Ocean Package Publisher'
          git config user.email 'packages@ocean.studio'
          git add apt/pool apt/dists/stable
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix(apt): publish complete verified signed snapshot [skip ci]'
          # If main advances, rerun selection/signing from the new state.
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ocean-private-publication-audit
          path: /tmp/ocean-apt-*.json
      - name: Remove imported key material
        if: always()
        run: |
          if [ -n "${GNUPGHOME:-}" ]; then
            gpgconf --kill gpg-agent || true
            rm -rf "$GNUPGHOME"
          fi
