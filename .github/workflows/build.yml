name: Build APK

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.0.12077973" \
            "cmake;3.22.1"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Verify Ocean architecture
        run: ./scripts/verify-native-only.sh

      - name: Build debug APK (Gradle)
        working-directory: android
        env:
          GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g
          OCEAN_DEV_AUTH_BYPASS: "true"
        run: ./gradlew clean test assembleDebug --no-daemon --stacktrace

      - name: Locate APK output
        id: apk
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK" ]; then
            echo "No APK found" >&2
            find android/app/build/outputs -type f || true
            exit 1
          fi
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "Found APK: $APK"
          ls -lh "$APK"

      - name: Upload APK artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: oceanstudio-debug-${{ github.sha }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish rolling debug release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view debug-latest >/dev/null 2>&1; then
            gh release edit debug-latest --target "$GITHUB_SHA" --prerelease --title "OceanStudio latest debug APK"
          else
            gh release create debug-latest --target "$GITHUB_SHA" --prerelease --title "OceanStudio latest debug APK" --notes "Automated debug build from $GITHUB_SHA"
          fi
          gh release upload debug-latest "${{ steps.apk.outputs.path }}#OceanStudio-debug.apk" --clobber

      - name: Build summary
        run: |
          {
            echo "## Ocean.studio APK build"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| **Type** | \`debug\` |"
            echo "| **Artifact** | \`oceanstudio-debug-${{ github.sha }}\` |"
            echo "| **File** | \`$(basename '${{ steps.apk.outputs.path }}')\` |"
            echo ""
            echo "Download from the **Artifacts** section, or from the **debug-latest** prerelease when artifact quota is unavailable."
          } >> "$GITHUB_STEP_SUMMARY"
