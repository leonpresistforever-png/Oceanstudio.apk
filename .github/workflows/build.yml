name: Validate Android source

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  gateway-integration:
    name: Real gateway and inference integration
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '26.4.0'
      - name: Consume the canonical gateway command
        run: python3 scripts/prepare-gateway-command.py
      - name: Build real host inference server from the same pinned source
        run: |
          set -euo pipefail
          revision=4d9176092d00586775af140581bb0b558ddc4389
          git init "$RUNNER_TEMP/llama-source"
          git -C "$RUNNER_TEMP/llama-source" remote add origin https://github.com/ggml-org/llama.cpp.git
          git -C "$RUNNER_TEMP/llama-source" fetch --depth 1 origin "$revision"
          git -C "$RUNNER_TEMP/llama-source" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/llama-source" rev-parse HEAD)" = "$revision"
          cmake -S "$RUNNER_TEMP/llama-source" -B "$RUNNER_TEMP/llama-build" \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF -DGGML_NATIVE=OFF \
            -DGGML_OPENMP=OFF -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_SERVER=ON -DLLAMA_BUILD_UI=OFF -DLLAMA_OPENSSL=OFF
          cmake --build "$RUNNER_TEMP/llama-build" --target llama-server --parallel 2
      - name: Download official integration fixture and JSON runtime
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            'https://huggingface.co/ggml-org/models/resolve/499bc8821c6b12b4e53c5bffcb21ec206f212d81/tinyllamas/stories15M-q4_0.gguf' \
            --output "$RUNNER_TEMP/stories.gguf"
          curl --fail --location --retry 3 \
            'https://repo.maven.apache.org/maven2/org/json/json/20240303/json-20240303.jar' \
            --output "$RUNNER_TEMP/json.jar"
      - name: Exercise actual installation, authorization contracts, model inference and fallback
        run: |
          python3 scripts/tests/test_gateway_integration.py \
            --gateway-root "$RUNNER_TEMP/gateway" \
            --llama-server "$RUNNER_TEMP/llama-build/bin/llama-server" \
            --model "$RUNNER_TEMP/stories.gguf" \
            --json-jar "$RUNNER_TEMP/json.jar"
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.0.12077973" \
            "cmake;3.22.1"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Verify Ocean architecture
        run: ./scripts/verify-native-only.sh

      - name: Run Master Directive Repairs and Provider Hub Tests
        run: |
          python3 scripts/tests/test_master_directive_repairs.py
          python3 scripts/tests/test_provider_hub.py
          python3 scripts/tests/test_runtime_auth_boundaries.py

      - name: Consume verified canonical gateway command
        run: python3 scripts/prepare-gateway-command.py

      - name: Verify bundled signed package catalogue
        run: |
          python3 ocean-packages/tests/test-apk-package-catalog.py \
            --assets android/app/src/main/assets/ocean/repository --min-packages 6482

      - name: Build Android FFmpeg and FFprobe from verified upstream source
        run: bash scripts/build-android-ffmpeg.sh

      - name: Build and package real Android llama-server
        run: bash scripts/build-android-llama.sh

      - name: Build debug APK (Gradle)
        working-directory: android
        env:
          GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g
          OCEAN_DEV_AUTH_BYPASS: "true"
        run: ./gradlew clean test assembleDebug --no-daemon --stacktrace

      - name: Verify and stage APK
        id: apk
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK" ]; then
            echo "No APK found" >&2
            find android/app/build/outputs -type f || true
            exit 1
          fi

          VERSION=$(sed -n 's/.*versionName "\([^"]*\)".*/\1/p' android/app/build.gradle | head -n1)
          VERSION_CODE=$(sed -n 's/.*versionCode \([0-9][0-9]*\).*/\1/p' android/app/build.gradle | head -n1)
          trap 'echo "APK verification failed at line $LINENO: $BASH_COMMAND"' ERR
          python3 scripts/verify-inference-apk.py "$APK"
          APK_CONTENTS=$(unzip -Z -1 "$APK")
          grep -Fxq 'lib/arm64-v8a/liboceanstudio_ext.so' <<< "$APK_CONTENTS"
          grep -Fxq 'lib/arm64-v8a/liboceanpty.so' <<< "$APK_CONTENTS"
          grep -Fxq 'lib/arm64-v8a/libllama-server.so' <<< "$APK_CONTENTS"
          grep -Fxq 'assets/ocean/gateway/ocean-gateway' <<< "$APK_CONTENTS"
          test "$(unzip -p "$APK" lib/arm64-v8a/libllama-server.so | sha256sum | cut -d' ' -f1)" = \
            "$(sha256sum android/app/src/main/jniLibs/arm64-v8a/libllama-server.so | cut -d' ' -f1)"
          if grep -Eq '^lib/arm64-v8a/lib(oceanstudio_ext|oceanpty)d\.so$' <<< "$APK_CONTENTS"; then
            echo 'Stale debug postfix native libraries found in APK' >&2
            exit 1
          fi
          # Native libraries are extracted before execution (useLegacyPackaging=true).
          # Their ELF LOAD alignment is verified above; APK entries need normal ZIP alignment.
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c 4 "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --min-sdk-version 28 "$APK"
          test "$(unzip -p "$APK" assets/ocean/robotic-eye/robotic-eye.glb | sha256sum | cut -d' ' -f1)" = \
            "$(sha256sum android/app/src/main/assets/ocean/robotic-eye/robotic-eye.glb | cut -d' ' -f1)"
          for binary in ffmpeg ffprobe; do
            test -s "android/app/src/main/assets/ocean/native/$binary"
            test "$(unzip -p "$APK" "assets/ocean/native/$binary" | sha256sum | cut -d' ' -f1)" = \
              "$(sha256sum "android/app/src/main/assets/ocean/native/$binary" | cut -d' ' -f1)"
          done
          CERT=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs --min-sdk-version 28 "$APK" \
            | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n1 | tr 'A-F' 'a-f' | tr -d ':')
          test -n "$CERT"
          mkdir -p "$RUNNER_TEMP/ocean-debug"
          FINAL="$RUNNER_TEMP/ocean-debug/OceanStudio-${VERSION}-arm64-debug.apk"
          cp "$APK" "$FINAL"
          sha256sum "$FINAL" > "$FINAL.sha256"

          echo "path=$FINAL" >> "$GITHUB_OUTPUT"
          echo "checksum=$FINAL.sha256" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "certificate=$CERT" >> "$GITHUB_OUTPUT"

          echo "Built: $FINAL"
          echo "Version: $VERSION ($VERSION_CODE)"
          echo "Certificate: $CERT"
          echo "Debug APK is test-only and uses a different signing identity from the published release."
          echo "The production workflow verifies release signing continuity."
          sha256sum "$FINAL"

      - uses: actions/upload-artifact@v4
        with:
          name: OceanStudio-${{ steps.apk.outputs.version }}-arm64-debug-test-only
          path: |
            ${{ steps.apk.outputs.path }}
            ${{ steps.apk.outputs.checksum }}

      - name: Preserve failed packaging evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ocean-packaging-diagnostics
          retention-days: 2
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/src/main/assets/ocean/native/llama-runtime.json
            android/app/build/test-results/testDebugUnitTest/

      - name: Publish installable test APK to GitHub Releases
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          APK_PATH: ${{ steps.apk.outputs.path }}
          APK_CHECKSUM: ${{ steps.apk.outputs.checksum }}
          VERSION: ${{ steps.apk.outputs.version }}
          CERTIFICATE: ${{ steps.apk.outputs.certificate }}
        run: |
          set -euo pipefail
          tag="v${VERSION}-test"
          cat > "$RUNNER_TEMP/test-release-notes.md" <<EOF
          ### OceanStudio ${VERSION} Test Release
          Test APK built and verified from commit \`${GITHUB_SHA:0:8}\`.

          #### What's New in v${VERSION}:
          - **Local inference**: Includes an Android arm64 llama-server built from pinned official source. Connect starts it, verifies generated text, and registers the local route used by Ocean Agent.
          - **Ocean gateway**: One-tap installation/start of integrity-pinned upstream OmniRoute. Browser authorization, native loopback callbacks, token exchange, provider model discovery, quota refresh, and encrypted gateway-key storage are wired into Connect.
          - **Connected-account fallback**: The upstream gateway handles a real priority combo across verified accounts. Ocean uses its OpenAI-compatible inference endpoint; the gateway handles provider-specific request/response translation and token refresh.
          - **Verification scope**: Build/signature/ABI checks and automated protocol tests. A user's live provider consent and subscription quota require completing account login on their device.

          #### Installation Note:
          This is a debug-signed test build. If you have an older version installed, please uninstall it first before installing this APK.
          EOF

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists; updating test APK assets and notes..."
            gh release upload "$tag" "$APK_PATH" "$APK_CHECKSUM" --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --title "OceanStudio ${VERSION} test APK" --notes-file "$RUNNER_TEMP/test-release-notes.md"
            exit 0
          fi
          gh release create "$tag" "$APK_PATH" "$APK_CHECKSUM" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "OceanStudio ${VERSION} test APK" --notes-file "$RUNNER_TEMP/test-release-notes.md"
