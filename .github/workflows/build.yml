name: Validate Android source

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.0.12077973" \
            "cmake;3.22.1"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Verify Ocean architecture
        run: ./scripts/verify-native-only.sh

      - name: Build debug APK (Gradle)
        working-directory: android
        env:
          GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g
          OCEAN_DEV_AUTH_BYPASS: "true"
        run: ./gradlew clean test assembleDebug --no-daemon --stacktrace

      - name: Verify and stage APK
        id: apk
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK" ]; then
            echo "No APK found" >&2
            find android/app/build/outputs -type f || true
            exit 1
          fi

          VERSION=$(sed -n 's/.*versionName "\([^"]*\)".*/\1/p' android/app/build.gradle | head -n1)
          VERSION_CODE=$(sed -n 's/.*versionCode \([0-9][0-9]*\).*/\1/p' android/app/build.gradle | head -n1)
          CERT=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK" \
            | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n1 | tr 'A-F' 'a-f' | tr -d ':')
          EXPECTED_CERT="b12468091b50e6fb94f815d82a3f685d57b452b1f2275ce534def7c55bc7e387"
          COMPATIBLE=false
          if [ "$CERT" = "$EXPECTED_CERT" ]; then COMPATIBLE=true; fi

          mkdir -p releases
          FINAL="releases/OceanStudio-${VERSION}-arm64-debug.apk"
          cp "$APK" "$FINAL"
          sha256sum "$FINAL" > "$FINAL.sha256"

          echo "path=$FINAL" >> "$GITHUB_OUTPUT"
          echo "checksum=$FINAL.sha256" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "certificate=$CERT" >> "$GITHUB_OUTPUT"
          echo "update_compatible=$COMPATIBLE" >> "$GITHUB_OUTPUT"

          echo "Built: $FINAL"
          echo "Version: $VERSION ($VERSION_CODE)"
          echo "Certificate: $CERT"
          echo "Matches OceanStudio 1.1.5 certificate: $COMPATIBLE"
          sha256sum "$FINAL"

      - name: Publish verified APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v${{ steps.apk.outputs.version }}"
          APK="${{ steps.apk.outputs.path }}"
          CHECKSUM="${{ steps.apk.outputs.checksum }}"

          echo "Publishing $APK under tag $TAG..."
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" "$APK" "$CHECKSUM" \
              --repo "$GITHUB_REPOSITORY" \
              --title "OceanStudio ${{ steps.apk.outputs.version }} — Official Source Build" \
              --notes "Fully compiled from current Android source with 6,501 verified Ocean packages. Architecture: arm64-v8a (minSdk 28). Checksum: $(cat $CHECKSUM)" \
              --latest
          else
            gh release upload "$TAG" "$APK" "$CHECKSUM" --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --latest
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: OceanStudio-${{ steps.apk.outputs.version }}-arm64-debug
          path: |
            ${{ steps.apk.outputs.path }}
            ${{ steps.apk.outputs.checksum }}
