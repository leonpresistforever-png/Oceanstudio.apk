name: Validate Android source

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.0.12077973" \
            "cmake;3.22.1"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Verify Ocean architecture
        run: ./scripts/verify-native-only.sh

      - name: Verify bundled signed package catalogue
        run: |
          python3 ocean-packages/tests/test-apk-package-catalog.py \
            --assets android/app/src/main/assets/ocean/repository --min-packages 6482

      - name: Build Android FFmpeg and FFprobe from verified upstream source
        run: bash scripts/build-android-ffmpeg.sh

      - name: Build debug APK (Gradle)
        working-directory: android
        env:
          GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g
          OCEAN_DEV_AUTH_BYPASS: "true"
        run: ./gradlew clean test assembleDebug --no-daemon --stacktrace

      - name: Verify and stage APK
        id: apk
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK" ]; then
            echo "No APK found" >&2
            find android/app/build/outputs -type f || true
            exit 1
          fi

          VERSION=$(sed -n 's/.*versionName "\([^"]*\)".*/\1/p' android/app/build.gradle | head -n1)
          VERSION_CODE=$(sed -n 's/.*versionCode \([0-9][0-9]*\).*/\1/p' android/app/build.gradle | head -n1)
          APK_CONTENTS=$(unzip -Z -1 "$APK")
          grep -Fxq 'lib/arm64-v8a/liboceanstudio_ext.so' <<< "$APK_CONTENTS"
          grep -Fxq 'lib/arm64-v8a/liboceanpty.so' <<< "$APK_CONTENTS"
          if grep -Eq '^lib/arm64-v8a/lib(oceanstudio_ext|oceanpty)d\.so$' <<< "$APK_CONTENTS"; then
            echo 'Stale debug postfix native libraries found in APK' >&2
            exit 1
          fi
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 4 "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --min-sdk-version 28 "$APK"
          test "$(unzip -p "$APK" assets/ocean/robotic-eye/robotic-eye.glb | sha256sum | cut -d' ' -f1)" = \
            "$(sha256sum android/app/src/main/assets/ocean/robotic-eye/robotic-eye.glb | cut -d' ' -f1)"
          for binary in ffmpeg ffprobe; do
            test -s "android/app/src/main/assets/ocean/native/$binary"
            test "$(unzip -p "$APK" "assets/ocean/native/$binary" | sha256sum | cut -d' ' -f1)" = \
              "$(sha256sum "android/app/src/main/assets/ocean/native/$binary" | cut -d' ' -f1)"
          done
          CERT=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs --min-sdk-version 28 "$APK" \
            | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n1 | tr 'A-F' 'a-f' | tr -d ':')
          test -n "$CERT"
          mkdir -p "$RUNNER_TEMP/ocean-debug"
          FINAL="$RUNNER_TEMP/ocean-debug/OceanStudio-${VERSION}-arm64-debug.apk"
          cp "$APK" "$FINAL"
          sha256sum "$FINAL" > "$FINAL.sha256"

          echo "path=$FINAL" >> "$GITHUB_OUTPUT"
          echo "checksum=$FINAL.sha256" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "certificate=$CERT" >> "$GITHUB_OUTPUT"

          echo "Built: $FINAL"
          echo "Version: $VERSION ($VERSION_CODE)"
          echo "Certificate: $CERT"
          echo "Debug APK is test-only and uses a different signing identity from the published release."
          echo "The production workflow verifies release signing continuity."
          sha256sum "$FINAL"

      - uses: actions/upload-artifact@v4
        with:
          name: OceanStudio-${{ steps.apk.outputs.version }}-arm64-debug-test-only
          path: |
            ${{ steps.apk.outputs.path }}
            ${{ steps.apk.outputs.checksum }}

      - name: Publish installable test APK to GitHub Releases
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          APK_PATH: ${{ steps.apk.outputs.path }}
          APK_CHECKSUM: ${{ steps.apk.outputs.checksum }}
          VERSION: ${{ steps.apk.outputs.version }}
          CERTIFICATE: ${{ steps.apk.outputs.certificate }}
        run: |
          set -euo pipefail
          tag="v${VERSION}-test"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists; updating test APK assets..."
            gh release upload "$tag" "$APK_PATH" "$APK_CHECKSUM" --repo "$GITHUB_REPOSITORY" --clobber
            exit 0
          fi
          cat > "$RUNNER_TEMP/test-release-notes.md" <<EOF
          Test APK built and verified from source commit $GITHUB_SHA.

          Includes the local robotic eye GLB, a visible animated agent background, slash commands, moving agent status, npm launcher repair, Android FFmpeg and FFprobe built from the verified official 8.1.2 source, bundled signed package catalogue, and native bootstrap.

          This is a debug-signed test build with a testing-only sign-in path. Its signing certificate ($CERTIFICATE) differs from the existing published APK. Android cannot install it as an update: uninstall the older app first, which removes its app data. The production APK remains blocked until the existing release signing keystore and authentication secret are configured.
          EOF
          gh release create "$tag" "$APK_PATH" "$APK_CHECKSUM" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "OceanStudio ${VERSION} test APK" --notes-file "$RUNNER_TEMP/test-release-notes.md"
