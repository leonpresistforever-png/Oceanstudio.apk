name: Publish committed OceanStudio APK

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Stable release tag (created when missing)
        required: true
        default: oceanstudio-latest

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify and publish committed APK
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          APK=releases/OceanStudio-latest-debug.apk
          CHECKSUM="$APK.sha256"
          sha256sum --check "$CHECKSUM"
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --title "OceanStudio latest debug APK" \
              --notes "Locally compiled and checksum-verified OceanStudio debug APK."
          fi
          gh release upload "$TAG" "$APK" "$CHECKSUM" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --latest
